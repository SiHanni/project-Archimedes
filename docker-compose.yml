x-app-db: &app_db
  MYSQL_HOST: mysql
  MYSQL_PORT: 3306
  MYSQL_USER: archimedes
  MYSQL_PASSWORD: archimedes
  MYSQL_DATABASE: archimedes
  REDIS_URL: redis://redis:6379
  QUEUE_NAME: archimedes:queue
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_BUCKET: archimedes-uploads
  S3_REGION: us-east-1

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: archimedes
      MYSQL_USER: archimedes
      MYSQL_PASSWORD: archimedes
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      # 호스트 포트: 로컬 기본 MySQL(3306) 등과 겹침 방지
      - "23306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  redis:
    image: redis:7-alpine
    ports:
      - "26379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "29000:9000"
      - "29001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: /bin/sh
    command: -c "sleep 4 && mc alias set local http://minio:9000 minioadmin minioadmin && mc mb local/archimedes-uploads --ignore-existing || true"
    restart: "no"

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      <<: *app_db
      ALGORITHM_VERSION: archimedes-g1-v0.1.0-scaffold
      WORKER_OUTPUT_DIR: /output
      ARCHIMEDES_DEPTH_BACKEND: ${ARCHIMEDES_DEPTH_BACKEND:-stub}
      ARCHIMEDES_DEPTH_MODEL_FILE: ${ARCHIMEDES_DEPTH_MODEL_FILE:-depth.onnx}
      ARCHIMEDES_DEPTH_OUTPUT_KIND: ${ARCHIMEDES_DEPTH_OUTPUT_KIND:-affine_invariant}
      ARCHIMEDES_ONNX_MODEL_DIR: /models
      ARCHIMEDES_OBJECT_SIDE: ${ARCHIMEDES_OBJECT_SIDE:-left}
      ARCHIMEDES_OCR_BACKEND: ${ARCHIMEDES_OCR_BACKEND:-rapidocr}
      ARCHIMEDES_SAVE_SEG_ASSETS: ${ARCHIMEDES_SAVE_SEG_ASSETS:-1}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "28000:8000"
    volumes:
      - worker_output:/output
      # 가중치는 이미지에 굽지 않는다 — scripts/fetch-models.sh 로 받아 마운트
      - ./models:/models:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker-consumer:
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      <<: *app_db
      ALGORITHM_VERSION: archimedes-g1-v0.1.0-scaffold
      WORKER_OUTPUT_DIR: /output
      ARCHIMEDES_MODE: consumer
      ARCHIMEDES_DEPTH_BACKEND: ${ARCHIMEDES_DEPTH_BACKEND:-stub}
      ARCHIMEDES_DEPTH_MODEL_FILE: ${ARCHIMEDES_DEPTH_MODEL_FILE:-depth.onnx}
      ARCHIMEDES_DEPTH_OUTPUT_KIND: ${ARCHIMEDES_DEPTH_OUTPUT_KIND:-affine_invariant}
      ARCHIMEDES_ONNX_MODEL_DIR: /models
      ARCHIMEDES_OBJECT_SIDE: ${ARCHIMEDES_OBJECT_SIDE:-left}
      ARCHIMEDES_OCR_BACKEND: ${ARCHIMEDES_OCR_BACKEND:-rapidocr}
      ARCHIMEDES_SAVE_SEG_ASSETS: ${ARCHIMEDES_SAVE_SEG_ASSETS:-1}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    volumes:
      - worker_output:/output
      - ./models:/models:ro
    command: ["python", "-m", "app.consumer"]
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      <<: *app_db
      PORT: 3000
      # 시세·견적 (계획서 Step 2-1). 로컬 기본은 고정 표 — 항상 stale 로 표시된다.
      PRICE_BACKEND: ${PRICE_BACKEND:-static}
      PRICE_TABLE_KRW_PER_GRAM: ${PRICE_TABLE_KRW_PER_GRAM:-{"gold:24k":118000,"gold:18k":86000,"gold:14k":66000,"silver:sterling":1400,"platinum:pt950":52000}}
      PRICE_API_URL: ${PRICE_API_URL:-}
      PRICE_API_KEY: ${PRICE_API_KEY:-}
      PRICE_BUY_RATE: ${PRICE_BUY_RATE:-1}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "23000:3000"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "25173:80"

volumes:
  mysql_data:
  minio_data:
  worker_output:
