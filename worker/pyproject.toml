[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archimedes-worker"
version = "0.1.0"
description = "Archimedes CV worker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "pillow>=10.4",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "boto3>=1.35",
  "redis>=5.2",
  "pymysql>=1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]
seg-rembg = [
  "rembg>=2.0.50",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "slow: synthetic OpenCV pipeline (optional)",
  "golden_manifest: needs ARCHIMEDES_GOLDEN_ROOT + manifest.json + images",
]
addopts = "-m \"not slow and not golden_manifest\""
