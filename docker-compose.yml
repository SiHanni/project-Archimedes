x-app-db: &app_db
  MYSQL_HOST: mysql
  MYSQL_PORT: 3306
  MYSQL_USER: archimedes
  MYSQL_PASSWORD: archimedes
  MYSQL_DATABASE: archimedes
  REDIS_URL: redis://redis:6379
  QUEUE_NAME: archimedes:queue
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_BUCKET: archimedes-uploads
  S3_REGION: us-east-1

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: archimedes
      MYSQL_USER: archimedes
      MYSQL_PASSWORD: archimedes
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: /bin/sh
    command: -c "sleep 4 && mc alias set local http://minio:9000 minioadmin minioadmin && mc mb local/archimedes-uploads --ignore-existing || true"
    restart: "no"

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      <<: *app_db
      ALGORITHM_VERSION: archimedes-g1-v0.1.0-scaffold
      WORKER_OUTPUT_DIR: /output
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - worker_output:/output
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker-consumer:
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      <<: *app_db
      ALGORITHM_VERSION: archimedes-g1-v0.1.0-scaffold
      WORKER_OUTPUT_DIR: /output
      ARCHIMEDES_MODE: consumer
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    volumes:
      - worker_output:/output
    command: ["python", "-m", "app.consumer"]
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      <<: *app_db
      PORT: 3000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "3000:3000"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  mysql_data:
  minio_data:
  worker_output:
