x-app-db: &app_db
  MYSQL_HOST: mysql
  MYSQL_PORT: 3306
  MYSQL_USER: archimedes
  MYSQL_PASSWORD: archimedes
  MYSQL_DATABASE: archimedes
  REDIS_URL: redis://redis:6379
  QUEUE_NAME: archimedes:queue
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_BUCKET: archimedes-uploads
  S3_REGION: us-east-1

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: archimedes
      MYSQL_USER: archimedes
      MYSQL_PASSWORD: archimedes
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      # 호스트 포트: 로컬 기본 MySQL(3306) 등과 겹침 방지
      - "23306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  redis:
    image: redis:7-alpine
    ports:
      - "26379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "29000:9000"
      - "29001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: /bin/sh
    command: -c "sleep 4 && mc alias set local http://minio:9000 minioadmin minioadmin && mc mb local/archimedes-uploads --ignore-existing || true"
    restart: "no"

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      <<: *app_db
      ALGORITHM_VERSION: archimedes-g1-v0.1.0-scaffold
      WORKER_OUTPUT_DIR: /output
      ARCHIMEDES_DEPTH_BACKEND: ${ARCHIMEDES_DEPTH_BACKEND:-stub}
      ARCHIMEDES_DEPTH_MODEL_FILE: ${ARCHIMEDES_DEPTH_MODEL_FILE:-depth.onnx}
      # 거리 추정용 metric depth. **초점거리 추정에만** 쓴다(절대깊이는 실측 10배 과대).
      ARCHIMEDES_DEPTHPRO_DIR: ${ARCHIMEDES_DEPTHPRO_DIR:-}
      ARCHIMEDES_DEPTHPRO_FILE: ${ARCHIMEDES_DEPTHPRO_FILE:-model_quantized.onnx}
      # 프롬프트 기반 분할(SlimSAM, 40MB). 외형 폴백의 임계값 흔들림을 줄인다.
      ARCHIMEDES_SAM_DIR: ${ARCHIMEDES_SAM_DIR:-}
      ARCHIMEDES_MATTE_DIR: ${ARCHIMEDES_MATTE_DIR:-/models/birefnet}
      # BiRefNet 은 한 장에 수십 초 걸리는 큰 모델이라 **한 잡의 지연**이 문제다.
      # 기본 2 는 작은 모델을 잡 병렬로 굴리던 시절의 값 — 코어를 놀린다.
      #
      # ⚠️ 올리기 전에 **메모리부터 보라.** 맥북에어 Docker VM(7.65GiB)에서는
      # fp32(928MB) 추론 첨두가 한도를 넘어, 4 로만 올려도 워커가 잡 중간에
      # 죽었다(재기동 루프 → 잡이 영원히 processing). 32GB 서버에서는 4 가 안전하다.
      ARCHIMEDES_ONNX_THREADS: ${ARCHIMEDES_ONNX_THREADS:-4}
      ARCHIMEDES_MATTE_FILE: ${ARCHIMEDES_MATTE_FILE:-model.onnx}
      ARCHIMEDES_DEPTH_OUTPUT_KIND: ${ARCHIMEDES_DEPTH_OUTPUT_KIND:-affine_invariant}
      ARCHIMEDES_ONNX_MODEL_DIR: /models
      ARCHIMEDES_OBJECT_SIDE: ${ARCHIMEDES_OBJECT_SIDE:-left}
      ARCHIMEDES_OCR_BACKEND: ${ARCHIMEDES_OCR_BACKEND:-rapidocr}
      ARCHIMEDES_SAVE_SEG_ASSETS: ${ARCHIMEDES_SAVE_SEG_ASSETS:-1}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "28000:8000"
    volumes:
      - worker_output:/output
      # 가중치는 이미지에 굽지 않는다 — scripts/fetch-models.sh 로 받아 마운트
      - ./models:/models:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker-consumer:
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      <<: *app_db
      ALGORITHM_VERSION: archimedes-g1-v0.1.0-scaffold
      WORKER_OUTPUT_DIR: /output
      ARCHIMEDES_MODE: consumer
      ARCHIMEDES_DEPTH_BACKEND: ${ARCHIMEDES_DEPTH_BACKEND:-stub}
      ARCHIMEDES_DEPTH_MODEL_FILE: ${ARCHIMEDES_DEPTH_MODEL_FILE:-depth.onnx}
      # 거리 추정용 metric depth. **초점거리 추정에만** 쓴다(절대깊이는 실측 10배 과대).
      ARCHIMEDES_DEPTHPRO_DIR: ${ARCHIMEDES_DEPTHPRO_DIR:-}
      ARCHIMEDES_DEPTHPRO_FILE: ${ARCHIMEDES_DEPTHPRO_FILE:-model_quantized.onnx}
      # 프롬프트 기반 분할(SlimSAM, 40MB). 외형 폴백의 임계값 흔들림을 줄인다.
      ARCHIMEDES_SAM_DIR: ${ARCHIMEDES_SAM_DIR:-}
      ARCHIMEDES_MATTE_DIR: ${ARCHIMEDES_MATTE_DIR:-/models/birefnet}
      # BiRefNet 은 한 장에 수십 초 걸리는 큰 모델이라 **한 잡의 지연**이 문제다.
      # 기본 2 는 작은 모델을 잡 병렬로 굴리던 시절의 값 — 코어를 놀린다.
      #
      # ⚠️ 올리기 전에 **메모리부터 보라.** 맥북에어 Docker VM(7.65GiB)에서는
      # fp32(928MB) 추론 첨두가 한도를 넘어, 4 로만 올려도 워커가 잡 중간에
      # 죽었다(재기동 루프 → 잡이 영원히 processing). 32GB 서버에서는 4 가 안전하다.
      ARCHIMEDES_ONNX_THREADS: ${ARCHIMEDES_ONNX_THREADS:-4}
      ARCHIMEDES_MATTE_FILE: ${ARCHIMEDES_MATTE_FILE:-model.onnx}
      ARCHIMEDES_DEPTH_OUTPUT_KIND: ${ARCHIMEDES_DEPTH_OUTPUT_KIND:-affine_invariant}
      ARCHIMEDES_ONNX_MODEL_DIR: /models
      ARCHIMEDES_OBJECT_SIDE: ${ARCHIMEDES_OBJECT_SIDE:-left}
      ARCHIMEDES_OCR_BACKEND: ${ARCHIMEDES_OCR_BACKEND:-rapidocr}
      ARCHIMEDES_SAVE_SEG_ASSETS: ${ARCHIMEDES_SAVE_SEG_ASSETS:-1}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    volumes:
      - worker_output:/output
      - ./models:/models:ro
    command: ["python", "-m", "app.consumer"]
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      <<: *app_db
      PORT: 3000
      # 시세·견적 (계획서 Step 2-1). 로컬 기본은 고정 표 — 항상 stale 로 표시된다.
      #
      # **팔 때(매입) 시세** 2026-08-07, 순도 999 기준 g당:
      #   금 188,800(1돈 708,000) · 은 2,645 · 백금 74,933
      # 나머지 함량은 순도비(999 기준)로 환산한 근사다. 실거래 매입가는 함량마다
      # 마진이 따로 붙으므로 정확한 값을 알게 되면 키별로 덮어쓸 것.
      PRICE_BACKEND: ${PRICE_BACKEND:-static}
      PRICE_TABLE_KRW_PER_GRAM: ${PRICE_TABLE_KRW_PER_GRAM:-{"gold:24k":188800,"gold:22k":173114,"gold:18k":141742,"gold:14k":110559,"gold:10k":78808,"silver:fine":2645,"silver:sterling":2449,"platinum:pt999":74933,"platinum:pt950":71258,"platinum:pt900":67507}}
      # 고정 표가 **언제 기준인지**. 없으면 조회 시각을 쓰게 되어 오늘 시세인 척한다.
      PRICE_TABLE_AS_OF: ${PRICE_TABLE_AS_OF:-2026-08-07}
      PRICE_API_URL: ${PRICE_API_URL:-}
      PRICE_API_KEY: ${PRICE_API_KEY:-}
      # 입력값이 이미 '팔 때' 시세라 추가 매입률을 곱하지 않는다
      PRICE_BUY_RATE: ${PRICE_BUY_RATE:-1}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "23000:3000"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "25173:80"

volumes:
  mysql_data:
  minio_data:
  worker_output:
